<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ce9bff"/>
      <stop offset="50%" stop-color="#8ed5ff"/>
      <stop offset="100%" stop-color="#45dfa4"/>
    </linearGradient>
    <linearGradient id="forecastGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ed5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8ed5ff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#223354" stroke-width="1.5"/>

  <!-- Grid / Coordinate subtle lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1b2844" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#1b2844" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Forecast spread lines (Ensemble members) -->
  <path d="M 10 38 Q 24 16 38 22" fill="none" stroke="#8ed5ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <path d="M 10 44 Q 24 28 38 34" fill="none" stroke="#8ed5ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 2"/>

  <!-- Forecast prior trajectory (before assimilation) -->
  <path d="M 10 41 Q 24 22 38 28 T 54 18" fill="none" stroke="url(#forecastGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- True / Assimilated Analysis Trajectory with glow -->
  <path d="M 10 41 Q 22 46 32 36 T 54 26" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Observation point (y_obs) with uncertainty ring -->
  <circle cx="32" cy="36" r="6" fill="none" stroke="#ffb4ab" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="32" cy="36" r="3" fill="#ffb4ab" filter="url(#glow)"/>

  <!-- Assimilation / Analysis Update Node (x_a) -->
  <circle cx="46" cy="30" r="2.5" fill="#45dfa4" filter="url(#glow)"/>

  <!-- Prior & Grid Sample Nodes -->
  <circle cx="18" cy="42" r="1.8" fill="#8ed5ff"/>
  <circle cx="54" cy="26" r="2" fill="#45dfa4"/>
</svg>