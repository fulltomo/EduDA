<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="glowPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="truthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="analysisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowCyan)" />
  <rect width="1200" height="630" fill="url(#glowPurple)" />

  <!-- Subtle Coordinate Grid -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="80" y1="120" x2="1120" y2="120" />
    <line x1="80" y1="200" x2="1120" y2="200" />
    <line x1="80" y1="280" x2="1120" y2="280" />
    <line x1="80" y1="360" x2="1120" y2="360" />
    <line x1="80" y1="440" x2="1120" y2="440" />
    <line x1="80" y1="520" x2="1120" y2="520" />
    <line x1="200" y1="80" x2="200" y2="550" />
    <line x1="400" y1="80" x2="400" y2="550" />
    <line x1="600" y1="80" x2="600" y2="550" />
    <line x1="800" y1="80" x2="800" y2="550" />
    <line x1="1000" y1="80" x2="1000" y2="550" />
  </g>

  <!-- Lorenz '96 Decorative Wave Lines in Background -->
  <path d="M 80,480 Q 250,220 420,380 T 760,260 T 1120,340" fill="none" stroke="url(#truthGrad)" stroke-width="4" opacity="0.85" filter="url(#glow)" />
  <path d="M 80,490 Q 250,240 420,370 T 760,280 T 1120,335" fill="none" stroke="url(#analysisGrad)" stroke-width="3" stroke-dasharray="6,6" opacity="0.9" />

  <!-- Observation Points (Scatter Dots) -->
  <circle cx="250" cy="230" r="7" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="420" cy="375" r="7" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="590" cy="450" r="7" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="760" cy="270" r="7" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="930" cy="210" r="7" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="1100" cy="338" r="7" fill="#f43f5e" filter="url(#glow)" />

  <!-- Logo & Title Section -->
  <g transform="translate(80, 110)">
    <!-- App Icon / Badge -->
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M 16,48 Q 26,20 36,36 T 56,24" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="36" cy="36" r="4" fill="#34d399" />
    <circle cx="56" cy="24" r="4" fill="#f43f5e" />

    <!-- Main Title -->
    <text x="96" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
      Edu<tspan fill="#38bdf8">DA</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1">
      データ同化学習・シミュレーションプラットフォーム
    </text>
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
      Educational Data Assimilation Platform with Lorenz '96 Model
    </text>
  </g>

  <!-- Formula Card (Floating Badge) -->
  <g transform="translate(720, 95)">
    <rect width="400" height="90" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="monospace" font-size="14" font-weight="600" fill="#38bdf8">Lorenz '96 Dynamics (N=40)</text>
    <text x="20" y="65" font-family="monospace" font-size="18" font-weight="500" fill="#f1f5f9">dxⱼ/dt = (xⱼ₊₁ - xⱼ₋₂)xⱼ₋₁ - xⱼ + F</text>
  </g>

  <!-- Supported Method Badges (Bottom Area) -->
  <g transform="translate(80, 545)">
    <!-- Method Pills -->
    <g transform="translate(0, 0)">
      <rect width="80" height="34" rx="8" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
      <text x="40" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">LETKF</text>
    </g>
    <g transform="translate(95, 0)">
      <rect width="80" height="34" rx="8" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="1" />
      <text x="40" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#818cf8" text-anchor="middle">4DVar</text>
    </g>
    <g transform="translate(190, 0)">
      <rect width="80" height="34" rx="8" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1" />
      <text x="40" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">EnSRF</text>
    </g>
    <g transform="translate(285, 0)">
      <rect width="90" height="34" rx="8" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1" />
      <text x="45" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">POEnKF</text>
    </g>
    <g transform="translate(390, 0)">
      <rect width="80" height="34" rx="8" fill="#8b5cf6" fill-opacity="0.25" stroke="#a78bfa" stroke-width="1" />
      <text x="40" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">3DVar</text>
    </g>
    <g transform="translate(485, 0)">
      <rect width="70" height="34" rx="8" fill="#64748b" fill-opacity="0.25" stroke="#94a3b8" stroke-width="1" />
      <text x="35" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle">EKF</text>
    </g>
    <g transform="translate(570, 0)">
      <rect width="60" height="34" rx="8" fill="#ec4899" fill-opacity="0.25" stroke="#f472b6" stroke-width="1" />
      <text x="30" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f472b6" text-anchor="middle">PF</text>
    </g>

    <!-- Lab Feature Tag -->
    <g transform="translate(720, 0)">
      <text x="320" y="23" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#94a3b8" text-anchor="end">
        🎓 プリセット実験ラボ &amp; Hovmöller 可視化搭載
      </text>
    </g>
  </g>
</svg>
