      <h1>EduDA - Educational Data Assimilation Platform / データ同化学習・シミュレーションプラットフォーム</h1>
      <p><strong>EduDA (Educational Data Assimilation)</strong> is an open-source interactive web platform designed to facilitate intuitive understanding and empirical comparison of data assimilation algorithms (EKF, POEnKF, EnSRF, LETKF, 3DVar, 4DVar, Particle Filter) on the standard chaotic Lorenz '96 testbed.</p>
      
      <h2>Governing Equations: Lorenz '96 Chaotic Dynamics</h2>
      <p>dx_j / dt = (x_{j+1} - x_{j-2}) x_{j-1} - x_j + F &nbsp; (j = 1, ..., 40, F = 8.0, periodic boundary conditions)</p>
      
      <h2>Supported Data Assimilation Algorithms</h2>
      <ul>
        <li><strong>EKF (Extended Kalman Filter)</strong>: Linearized tangent-linear covariance update with model process noise Q.</li>
        <li><strong>POEnKF (Perturbed Observation EnKF)</strong>: Monte Carlo ensemble sampling with perturbed synthetic observations.</li>
        <li><strong>EnSRF (Ensemble Square Root Filter)</strong>: Deterministic square root mean and perturbation update avoiding observation noise sampling error.</li>
        <li><strong>LETKF (Local Ensemble Transform Kalman Filter)</strong>: Parallel local grid-space low-dimensional ensemble transforms.</li>
        <li><strong>3DVar (3D Variational)</strong>: Static Gaspari-Cohn background error covariance matrix (B).</li>
        <li><strong>4DVar (4D Variational)</strong>: Adjoint model gradient optimization over a time assimilation window.</li>
        <li><strong>PF (Particle Filter / SIR)</strong>: Sequential Importance Resampling for non-Gaussian distributions.</li>
      </ul>

      <h2>Pre-Designed Educational Preset Labs</h2>
      <ol>
        <li><strong>Lab 1: Effects of Inflation</strong> - Preventing ensemble shrinkage and filter divergence under limited ensemble size.</li>
        <li><strong>Lab 2: Effects of Localization</strong> - Cutting spurious distant correlations under small ensemble sizes.</li>
        <li><strong>Lab 3: Static (3DVar) vs Flow-Dependent (LETKF) Covariance</strong> - Error propagation into unobserved domains under sparse observation.</li>
        <li><strong>Lab 4: High-Dimensional Particle Filtering Limits</strong> - Experiencing weight collapse and the curse of dimensionality.</li>
      </ol>
      <p><em>Please enable JavaScript to run and visualize the simulations interactively.</em></p>
