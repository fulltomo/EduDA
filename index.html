      <h1>EduDA - データ同化学習・シミュレーションプラットフォーム</h1>
      <p><strong>EduDA (Educational Data Assimilation)</strong> は、気象学・海洋学・数理科学分野で重要なデータ同化（Data Assimilation: DA）の基礎理論とアルゴリズムを、ブラウザ上で直感的に学べるオープンソースWebアプリケーションです。</p>
      
      <h2>支配方程式：Lorenz '96 カオスモデル</h2>
      <p>dx_j / dt = (x_{j+1} - x_{j-2}) x_{j-1} - x_j + F (j = 1, ..., 40, F = 8.0, 周期境界条件)</p>
      
      <h2>サポートされている7つのデータ同化手法</h2>
      <ul>
        <li><strong>EKF (拡張カルマンフィルタ)</strong>: 接線線形モデルを用いた線形化カルマンフィルタ</li>
        <li><strong>POEnKF (観測摂動型アンサンブルカルマンフィルタ)</strong>: モンテカルロアンサンブルと観測摂動</li>
        <li><strong>EnSRF (アンサンブル平方根フィルタ)</strong>: 決定論的平方根更新による観測ノイズ誤差排除</li>
        <li><strong>LETKF (局所アンサンブル変換カルマンフィルタ)</strong>: 格子点局所空間での並列変換カルマンフィルタ</li>
        <li><strong>3DVar (3次元変分法)</strong>: Gaspari-Cohn静的背景誤差共分散行列(B)による変分法</li>
        <li><strong>4DVar (4次元変分法)</strong>: 随伴モデルを用いた時間窓内観測の同時最適化</li>
        <li><strong>PF (粒子フィルタ / SIR)</strong>: 有効粒子数リサンプリングを備えた非ガウス対応フィルタ</li>
      </ul>

      <h2>事前設計されたプリセット実験ラボ</h2>
      <ol>
        <li><strong>実験1: インフレーションの効果</strong> - 有限アンサンブルによる共分散過小評価とフィルタ発散の克服</li>
        <li><strong>実験2: 局所化 (Localization) の効果</strong> - 少メンバー時の遠隔疑似相関の排除</li>
        <li><strong>実験3: 固定共分散 vs 流れ依存共分散</strong> - 疎密観測下での未観測領域への誤差共分散伝播</li>
        <li><strong>実験4: 高次元空間での粒子フィルタの限界</strong> - 次元の呪いと重みの崩壊</li>
      </ol>
      <p>※ 本シミュレータをインタラクティブに操作・可視化するには、JavaScriptを有効にしてください。</p>
